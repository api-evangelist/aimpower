description: >-
  How callers authenticate to Brainsuite. There is no public OpenAPI, so this profile is
  built from documents the provider actually serves anonymously rather than derived from a
  spec. Platform sign-in is OpenID Connect against an Amazon Cognito user pool the company
  operates in eu-central-1, fronted by its own authorization-server domain
  auth.brainsuite.ai. The Creative Effectiveness API is a separate, entirely closed surface:
  every path on api.brainsuite.ai answers HTTP 401 {"message":"Unauthorized"} to an
  anonymous caller, and the provider states that API credentials are issued on request.

api_host: https://api.brainsuite.ai/brainsuite
public_reference_published: false

