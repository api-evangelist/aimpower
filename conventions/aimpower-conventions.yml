  conflict_behavior: null
  docs: null
  note: >-
    No idempotency mechanism is documented on any public Brainsuite surface. The API's primary
    operation is an asset submission that starts a billable AI evaluation, which is exactly the
    shape of call where a client retry after a timeout could charge and score the same asset
    twice - and nothing published tells an integrator whether that is safe. coverage is recorded
    as none because none is published; if a key header exists inside the private documentation
    bundle, this should be upgraded on a future round with the provider's own wording.

