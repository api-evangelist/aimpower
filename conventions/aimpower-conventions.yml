  Stated by the provider's own anonymous runtime configuration document as
  brainsuitePublicApiBaseUrl at
  https://api.brainsuite.ai/brainsuite/frontend-configuration/v2/configuration (HTTP 200).
api_style: REST over HTTPS, JSON responses (observed on the one anonymous endpoint)
