  note: >-
    The platform runs Datadog RUM on the front end, so server-side correlation ids very likely
    exist, but no request-id or trace header is documented for API consumers.

async_processing:
  model: >-
    Evaluation is asynchronous by nature - assets are submitted, processed by the AI models, and
    a report becomes available afterwards. The company documents email push notification "when
    processing is completed" for the application. Whether the API exposes a webhook, a callback
    URL, or requires polling is not published.
  webhooks_documented: false
  polling_documented: false

reversibility:
  grade: none
  assessed: true
  write_surface: true
  write_operations:
  - Submit an asset (upload, or supply an asset URL) for ACE evaluation - billable, usage-priced.
  - Declare or update asset attributes such as brand, market and channel.
  reversal_operations: []
  window: null
  docs: null
  note: >-
    No cancel, delete, void, undo or restore operation is documented for the API, and no window
    is stated for any of them. The application (not the API) gained asset archiving and project
    renaming in the 2026-08-23 release, which implies a soft-delete of some kind exists in the
    data model, but nothing published says whether it is reachable over the API, whether it
    refunds or voids a billable evaluation, or how long an archived asset can be restored. No
    window is asserted here, because asserting one the provider has not stated is the single
    error in this artifact that could cost a user money.

dry_run_mode:
  supported: unknown
  note: >-
    Not documented. The nearest published equivalent is the self-serve DIY interface, which the
    company positions as the manual counterpart to the API for experimentation and A/B testing -
    a separate product path, not a dry-run flag on the API.

