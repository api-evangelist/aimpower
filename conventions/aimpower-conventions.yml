description: >-
  Cross-cutting runtime semantics of the Brainsuite Creative Effectiveness API. This profile is
  mostly a record of what an integrator CANNOT learn before signing: the company describes the
  API's purpose and shape in prose - upload an asset or give a URL, declare brand, market and
  channel, get an ACE report back - but publishes no reference, so the concrete conventions an
  agent or an integrating engineer needs (idempotency, pagination, error envelope, rate-limit
  signalling, retry semantics, reversal) exist only inside the documentation bundle issued with
  credentials. Everything marked unpublished below was searched for and not found, not skipped.

