description: >-
  What Brainsuite publishes about how its API changes over time. The answer is: almost
  nothing. There is a real, actively maintained product changelog, but no versioning policy,
  no deprecation policy, no Sunset or Deprecation header commitment, no SLA document and no
  status page. The only versioning signal that exists at all is structural - the company's
  own runtime configuration is served from a path segment /v2/, which shows the API carries
  a path-based major version, but no policy governs it publicly.

