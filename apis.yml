apis:
- aid: aimpower-creative-effectiveness-api
  name: Brainsuite Creative Effectiveness API
  description: Automated, programmatic access to the same AI creative-evaluation engine behind the Brainsuite
    application. Partners and enterprise customers upload assets (or supply asset URLs), declare attributes
    such as brand, market and channel, and receive ACE effectiveness reports and KPI scores back for
    integration into DAM systems, media-creation tools, generative-AI platforms and internal analytics.
    Credentials and the API reference are issued on request; no public specification or reference is
    published.
